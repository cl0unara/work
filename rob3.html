<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакти | Більярд</title>
  <link rel="stylesheet" href="rob1.css">
</head>
<body>
  <a href="#main" class="skip-link">Перейти до основного змісту</a>
  <header>
    <img src="logo.png" alt="" width="50">
    <p>Більярдний трекер</p>
    <p>Статистика тренувань та вибір кия</p>
    <nav aria-label="Головна навігація">
      <ul>
        <li><a href="rob.html">Головна</a></li>
        <li><a href="rob2.html">Інвентар</a></li>
        <li><a href="rob3.html" aria-current="page">Контакти</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <section>
      <h2>Напишіть нам</h2>
      <form method="post">
        <div>
          <label for="userName">Ім’я</label>
          <input type="text" id="userName" name="userName" required>
        </div>
        <div>
          <label for="userEmail">Ел. пошта</label>
          <input type="email" id="userEmail" name="userEmail" required>
        </div>
        <div>
          <label for="userPhone">Телефон</label>
          <input type="tel" id="userPhone" name="userPhone" pattern="^\+380\d{9}$" aria-describedby="phoneHint" required>
          <small id="phoneHint">Формат: +380XXXXXXXXX</small>
        </div>
        <div>
          <label for="userMessage">Повідомлення</label>
          <textarea id="userMessage" name="userMessage" minlength="10" aria-describedby="msgHint" required></textarea>
          <small id="msgHint">Мінімум 10 символів</small>
        </div>
        <button type="submit">Відправити</button>
      </form>
    </section>
  </main>
  <footer>
    <p>© 2026 Більярдний трекер</p>
    <nav aria-label="Навігація в підвалі">
      <ul>
        <li><a href="rob.html">Головна</a></li>
        <li><a href="rob3.html">Контакти</a></li>
        <li><a href="policy.html">Політика</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
